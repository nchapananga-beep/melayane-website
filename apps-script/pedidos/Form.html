<!doctype html><html lang="pt"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MELAYANE — Contacto</title><style>body{font:16px Arial,sans-serif;background:#f3f7f6;color:#102a3b;margin:0;padding:24px}main{max-width:850px;margin:auto;background:white;padding:28px;border-radius:16px}label{display:block;margin:18px 0 6px}input,select,textarea,button{font:inherit;padding:12px;box-sizing:border-box;max-width:100%}input:not([type=checkbox]),textarea,select{width:100%;border:1px solid #9eafb5;border-radius:6px}button{background:#102a3b;color:white;border:0;border-radius:6px;cursor:pointer;margin:14px 0}button:disabled{opacity:.5}article{border:1px solid #ccd9dc;padding:18px;margin:16px 0;border-radius:8px;overflow-wrap:anywhere}p{line-height:1.6;white-space:pre-wrap}.trap{display:none}#aviso{font-weight:bold}a{color:#16675f}</style></head><body><main><h1>Como podemos ajudar?</h1><p>Envie o seu pedido à MELAYANE. Indique um email ou telefone para receber a nossa resposta.</p><form id="pedido"><label for="nome">Nome *</label><input id="nome" maxlength="120" autocomplete="name" required><label for="email">Email</label><input id="email" type="email" maxlength="180" autocomplete="email"><label for="telefone">Telefone / WhatsApp</label><input id="telefone" type="tel" maxlength="40" autocomplete="tel"><label for="servico">Serviço *</label><select id="servico" required><option value="">Seleccione</option><option>Software de gestão MELAYANE</option><option>Soluções digitais à medida</option><option>Organização de processos</option></select><label for="mensagem">Mensagem *</label><textarea id="mensagem" rows="6" maxlength="2500" required></textarea><div class="trap" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div><label><input id="consentimento" type="checkbox" required> Autorizo a MELAYANE a guardar estes dados para responder e acompanhar o meu pedido.</label><p>Não inclua palavras-passe, dados bancários ou documentos de identificação.</p><button id="enviar">Enviar pedido</button><p id="aviso" role="status" aria-live="polite"></p></form></main><script>
document.getElementById('pedido').addEventListener('submit',function(e){
e.preventDefault();const aviso=document.getElementById('aviso'),botao=document.getElementById('enviar');
const d={};['nome','email','telefone','servico','mensagem','website'].forEach(k=>d[k]=document.getElementById(k).value.trim());d.consentimento=document.getElementById('consentimento').checked;
if(!d.email&&!d.telefone){aviso.textContent='Indique um email ou telefone.';return;}
botao.disabled=true;aviso.textContent='A enviar…';
google.script.run.withSuccessHandler(function(r){aviso.textContent='MELAYANE — Pedido recebido. Referência: '+r.id;document.getElementById('pedido').reset();botao.disabled=false;}).withFailureHandler(function(err){aviso.textContent=err.message||'Não foi possível enviar. Tente novamente.';botao.disabled=false;}).enviarPedido(d);
});</script></body></html>
